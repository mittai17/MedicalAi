# Project-wide Gradle settings

# JVM memory allocation — raised for Compose + KSP/Room compilation speed
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# AndroidX migration
android.useAndroidX=true

# Non-transitive R classes for faster builds
android.nonTransitiveRClass=true

# Kotlin code style
kotlin.code.style=official

# Enable Gradle build cache
org.gradle.caching=true

# Parallel execution
org.gradle.parallel=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Let configurations be resolved in parallel
org.gradle.configureondemand=false

# Configuration cache (big build-time win on later runs)
org.gradle.configuration-cache=true

# Incremental Kotlin compilation
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process

# Defer dependency verification/network checks (deps are already cached)
org.gradle.offline=false
